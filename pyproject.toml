[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omini-camera-render"
version = "0.1.0"
description = "Standalone silhouette-based camera alignment and Blender object rendering"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.5,<2",
    "scipy>=1.10,<1.14",
    "opencv-python-headless>=4.8,<4.11",
]

[tool.setuptools.packages.find]
include = ["omini_camera_render*"]
